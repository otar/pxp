name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module metadata
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: make fmt
      - name: Vet
        run: make vet
      - name: Staticcheck
        run: make staticcheck
      - name: Validate GitHub Actions workflows
        run: make actionlint
      - name: Check installer
        run: |
          bash -n install.sh
          shellcheck install.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.25.0'
          - os: ubuntu-24.04
            go: '1.26.5'
          - os: ubuntu-24.04-arm
            go: '1.26.5'
          - os: macos-15-intel
            go: '1.25.0'
          - os: macos-15-intel
            go: '1.26.5'
          - os: macos-15
            go: '1.26.5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - name: Unit and black-box tests
        run: go test -race ./...
      - name: Build binaries
        run: make build
      - name: Smoke test binaries
        run: |
          ./bin/pxp version
          ./bin/pxp-convert --help
          ./bin/pxp-bench --help
